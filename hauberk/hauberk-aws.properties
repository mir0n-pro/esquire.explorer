# Esquire Haubergeon -- overlay for AWS (EKS, us-east-1).
#
# Inherits EVERYTHING from hauberk.properties; only the endpoints and the
# infra-orchestration commands change. HauberkConfig loads hauberk.properties
# first and overlays this file, so the playground id, the prepare / move /
# super knobs and the KC client + secret stay in sync with the canonical file.
#
# Usage:
#   hauberk.cmd run smoke        --config hauberk-aws.properties
#   hauberk.cmd run entity-smoke --config hauberk-aws.properties
#
# ONE PUBLIC HOST, THREE PATHS. Unlike OKE, which gives the gateway a hostname
# of its own, AWS serves everything from aws-esquire.mir0n.pro:
#   KC       /kc-auth   -> the KeyCloak StatefulSet
#   gateway  /esq-api   -> the gateway, with the prefix REWRITTEN away
#   BFF      /          -> the SPA, /auth/* and the /api/* proxy
#
# THE GATEWAY PREFIX IS STRIPPED BY A SEPARATE INGRESS (k8s-aws/ingress.yaml,
# esquire-public-gw). The gateway serves at the root, so without that rewrite it
# is handed /esq-api/esq-cmd and answers 404 -- and the 404 is INVISIBLE, because
# an unmatched path falls through to the BFF and the BFF answers any unknown path
# with the SPA index: 200, 76KB, no token needed. Check a gateway probe by its
# CONTENT TYPE (application/json) and by a 401 without a token, never by 200.
kc.base=https://aws-esquire.mir0n.pro/kc-auth
gw.base=https://aws-esquire.mir0n.pro/esq-api
bff.base=https://aws-esquire.mir0n.pro

# WHAT IS NOT REACHABLE FROM OUTSIDE, and is pointed at a name that cannot resolve
# so a run fails at once instead of quietly hitting something else. The base file
# points both at localhost, and a localhost left in place would reach the docker
# lab on this workstation -- a run that measures the wrong system and reports
# success. That has already cost a full round of false verification once.
#
#   enyman.base  the R6 HA timeout smoke calls enyMan on its own port. Only the
#                gateway and the BFF are public here, so ha-timeout-smoke does
#                not run against AWS.
#   pg.*         kc-reconcile reads esq2025 straight over JDBC. The database is
#                RDS in a private subnet, so it does not run against AWS either.
enyman.base=http://enyman-is-not-public.invalid:3003
pg.url=jdbc:postgresql://rds-is-not-public.invalid:5432/esq2025

# THE BROKER IS AMAZON MQ -- MANAGED, AND NOT A POD. There is no stop / start to
# drive, so the message-loss simulations do not run here. These overrides exist to
# REFUSE: inherited, the docker commands from hauberk.properties would stop the
# broker of the local lab on this workstation while the load drove AWS, and report
# success. bizTree is a StatefulSet and can be driven, so those two are real.
cmd.stop-amq=echo [hauberk-aws] REFUSED: the broker is Amazon MQ, managed -- there is no pod to stop && exit 1
cmd.start-amq=echo [hauberk-aws] REFUSED: the broker is Amazon MQ, managed -- there is no pod to start && exit 1
cmd.recreate-biztree=kubectl --context arn:aws:eks:us-east-1:133464368861:cluster/esquire-aws set env statefulset/esquire-biztree-biztree BIZTREE_DIRECTOR=taijitu BIZTREE_TAIJITU_ON_MISMATCH={BIZTREE_ON_MISMATCH} BIZTREE_TAIJITU_SWEEP_INTERVAL_MS={BIZTREE_SWEEP_INTERVAL_MS} && kubectl --context arn:aws:eks:us-east-1:133464368861:cluster/esquire-aws rollout restart statefulset/esquire-biztree-biztree && kubectl --context arn:aws:eks:us-east-1:133464368861:cluster/esquire-aws rollout status statefulset/esquire-biztree-biztree --timeout=180s
cmd.restart-biztree=kubectl --context arn:aws:eks:us-east-1:133464368861:cluster/esquire-aws rollout restart statefulset/esquire-biztree-biztree && kubectl --context arn:aws:eks:us-east-1:133464368861:cluster/esquire-aws rollout status statefulset/esquire-biztree-biztree --timeout=180s
