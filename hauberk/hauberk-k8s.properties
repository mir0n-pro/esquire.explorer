# Esquire Haubergeon -- overlay for local Kubernetes (Docker Desktop).
#
# Inherits EVERYTHING from hauberk.properties; only the endpoint URLs differ.
# HauberkConfig loads hauberk.properties first, then overlays this file --
# so playground/prepare/move/super knobs + auth client + secret stay in
# sync with the canonical hauberk.properties.
#
# Usage:
#   hauberk.cmd run entity-smoke --config hauberk-k8s.properties
#   hauberk.cmd run entity-smoke --config hauberk-k8s.properties --S
#
# Endpoints: local k8s is ingress-fronted (ingress-nginx + MetalLB), mirroring OKE shape. Resolve
# esquire.localhost / api.esquire.localhost via hosts file (one-line entry
# 127.0.0.1 esquire.localhost api.esquire.localhost).
#   KC       localhost:8081/kc-auth   DIRECT (port-forward -- NOT through the ingress; see below)
#   gateway  api.esquire.localhost    ingress-fronted
#   BFF      esquire.localhost        ingress-fronted
#
# KC is fetched DIRECT, around the ingress, on purpose: hauberk's KcTokenClient uses
# java.net.http.HttpClient, and a JDK-HttpClient POST to the KC /token endpoint HANGS through ingress-nginx
# (HTTP/2-negotiation / chunked-response mis-parse -- the GET pre-check survives it, the POST does not;
# curl through the ingress works, so it is the JDK client + nginx, not KC). So route the token fetch around
# nginx. Before a k8s run, expose KC on localhost:8081:
#   kubectl port-forward -n default svc/esquire-infra-kc-keycloak 8081:8080
# KC issues esquire.localhost as the token issuer regardless (KC_HOSTNAME), so the gateway still accepts the
# bearer. gateway + BFF stay ingress-fronted (Gatling/Netty handles those fine -- only the JDK POST is affected).
kc.base=http://localhost:8081/kc-auth
gw.base=http://localhost:8808
bff.base=http://esquire.localhost

# Infra-orchestration commands for local k8s (override the docker cmd.* inherited from
# hauberk.properties). {KEY} placeholders are filled by Cmd from the env map the sim passes.
cmd.stop-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=0 && kubectl wait --for=delete pod/esquire-infra-amq-activemq-0 --timeout=90s
cmd.start-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=1 && kubectl rollout status statefulset/esquire-infra-amq-activemq --timeout=120s
cmd.recreate-biztree=kubectl set env statefulset/esquire-biztree-biztree BIZTREE_DIRECTOR=taijitu BIZTREE_TAIJITU_ON_MISMATCH={BIZTREE_ON_MISMATCH} BIZTREE_TAIJITU_SWEEP_INTERVAL_MS={BIZTREE_SWEEP_INTERVAL_MS} && kubectl rollout restart statefulset/esquire-biztree-biztree && kubectl rollout status statefulset/esquire-biztree-biztree --timeout=150s
cmd.restart-biztree=kubectl rollout restart statefulset/esquire-biztree-biztree && kubectl rollout status statefulset/esquire-biztree-biztree --timeout=150s
