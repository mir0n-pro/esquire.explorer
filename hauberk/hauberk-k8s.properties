# Esquire Haubergeon -- overlay for local Kubernetes (Docker Desktop).
#
# Inherits EVERYTHING from hauberk.properties; only the endpoint URLs differ.
# HauberkConfig loads hauberk.properties first, then overlays this file --
# so playground/prepare/move/super knobs + auth client + secret stay in
# sync with the canonical hauberk.properties.
#
# Usage:
#   hauberk.cmd run entity-smoke --config hauberk-k8s.properties
#   hauberk.cmd run entity-smoke --config hauberk-k8s.properties --S
#
# Endpoints: local k8s is now ingress-fronted (ingress-nginx + MetalLB),
# mirroring OKE shape exactly. Resolve esquire.localhost / api.esquire.localhost
# via hosts file (one-line entry 127.0.0.1 esquire.localhost api.esquire.localhost).
#   KC       esquire.localhost/kc-auth    (was localhost:8080 LoadBalancer)
#   gateway  api.esquire.localhost        (was localhost:8808 LoadBalancer)
#   BFF      esquire.localhost            (was localhost:4200 LoadBalancer)
kc.base=http://esquire.localhost/kc-auth
gw.base=http://api.esquire.localhost
bff.base=http://esquire.localhost

# Infra-orchestration commands for local k8s (override the docker cmd.* inherited from
# hauberk.properties). {KEY} placeholders are filled by Cmd from the env map the sim passes.
cmd.stop-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=0 && kubectl wait --for=delete pod/esquire-infra-amq-activemq-0 --timeout=90s
cmd.start-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=1 && kubectl rollout status statefulset/esquire-infra-amq-activemq --timeout=120s
cmd.recreate-biztree=kubectl set env deployment/esquire-biztree-biztree BIZTREE_DIRECTOR=taijitu BIZTREE_TAIJITU_ON_MISMATCH={BIZTREE_ON_MISMATCH} BIZTREE_TAIJITU_SWEEP_INTERVAL_MS={BIZTREE_SWEEP_INTERVAL_MS} && kubectl rollout restart deployment/esquire-biztree-biztree && kubectl rollout status deployment/esquire-biztree-biztree --timeout=150s
cmd.restart-biztree=kubectl rollout restart deployment/esquire-biztree-biztree && kubectl rollout status deployment/esquire-biztree-biztree --timeout=150s
