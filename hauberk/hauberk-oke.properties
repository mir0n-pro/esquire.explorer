# Esquire Haubergeon -- overlay for OKE production.
#
# Inherits EVERYTHING from hauberk.properties; only the endpoint URLs and
# the gateway hostname change. HauberkConfig loads hauberk.properties first,
# then overlays this file on top -- so the playground id, prepare/move/super
# knobs, and KC client + secret stay in sync with the canonical config.
#
# Usage:
#   hauberk.cmd run entity-smoke --config hauberk-oke.properties
#   hauberk.cmd run entity-smoke --config hauberk-oke.properties --S
#
# Endpoints in OKE:
#   KC       https://esquire.mir0n.pro/kc-auth        (browser-style host;
#                                                      same one BFF + ingress use)
#   Gateway  https://api.esquire.mir0n.pro            (separate ingress host,
#                                                      JWT-only, points at the
#                                                      in-cluster gateway svc)
#   BFF      https://esquire.mir0n.pro                (LoginViaBff chain root)
#
# Pre-requisites for OKE smoke:
#   - DNS: api.esquire.mir0n.pro -> 132.145.108.82 propagated to your resolver
#   - cert-manager has issued the SAN cert covering api.esquire.mir0n.pro
#     (check: kubectl get certificate -n default OR curl -v
#      https://api.esquire.mir0n.pro/ -- expect TLS handshake to succeed)

kc.base=https://esquire.mir0n.pro/kc-auth
gw.base=https://api.esquire.mir0n.pro
bff.base=https://esquire.mir0n.pro
