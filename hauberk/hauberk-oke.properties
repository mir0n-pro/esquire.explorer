# Esquire Haubergeon -- overlay for OKE production.
#
# Inherits EVERYTHING from hauberk.properties; only the endpoint URLs and
# the gateway hostname change. HauberkConfig loads hauberk.properties first,
# then overlays this file on top -- so the playground id, prepare/move/super
# knobs, and KC client + secret stay in sync with the canonical config.
#
# Usage:
#   hauberk.cmd run entity-smoke --config hauberk-oke.properties
#   hauberk.cmd run entity-smoke --config hauberk-oke.properties --S
#
# Endpoints in OKE:
#   KC       https://esquire.mir0n.pro/kc-auth        (browser-style host;
#                                                      same one BFF + ingress use)
#   Gateway  https://api.esquire.mir0n.pro            (separate ingress host,
#                                                      JWT-only, points at the
#                                                      in-cluster gateway svc)
#   BFF      https://esquire.mir0n.pro                (LoginViaBff chain root)
#
# Pre-requisites for OKE smoke:
#   - DNS: api.esquire.mir0n.pro -> 132.145.108.82 propagated to your resolver
#   - cert-manager has issued the SAN cert covering api.esquire.mir0n.pro
#     (check: kubectl get certificate -n default OR curl -v
#      https://api.esquire.mir0n.pro/ -- expect TLS handshake to succeed)

kc.base=https://esquire.mir0n.pro/kc-auth
gw.base=https://api.esquire.mir0n.pro
bff.base=https://esquire.mir0n.pro

# Infra-orchestration commands for OKE (override the docker cmd.* from hauberk.properties).
# Same resource names as local k8s; these run against the ACTIVE kubectl context, so the OKE
# context (context-czhlwnp27sq) MUST be selected before running an OKE message-loss sim.
# {KEY} placeholders are filled by Cmd from the env map the sim passes.
cmd.stop-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=0 -n default && kubectl wait --for=delete pod/esquire-infra-amq-activemq-0 -n default --timeout=120s
cmd.start-amq=kubectl scale statefulset/esquire-infra-amq-activemq --replicas=1 -n default && kubectl rollout status statefulset/esquire-infra-amq-activemq -n default --timeout=180s
cmd.recreate-biztree=kubectl set env deployment/esquire-biztree-biztree -n default BIZTREE_DIRECTOR=taijitu BIZTREE_TAIJITU_ON_MISMATCH={BIZTREE_ON_MISMATCH} BIZTREE_TAIJITU_SWEEP_INTERVAL_MS={BIZTREE_SWEEP_INTERVAL_MS} && kubectl rollout restart deployment/esquire-biztree-biztree -n default && kubectl rollout status deployment/esquire-biztree-biztree -n default --timeout=210s
cmd.restart-biztree=kubectl rollout restart deployment/esquire-biztree-biztree -n default && kubectl rollout status deployment/esquire-biztree-biztree -n default --timeout=210s
