services:
  frontend:
    container_name: esq-frontend
    build:
      context: .
    image: esquire.frontend
    ports:
      - "4200:4200"
    # Live-reload Angular dev server. /api and /auth are proxied to the
    # backend service (esq-backend:3000) via proxy.conf.docker.json.
    command: >
      npx ng serve
      --host 0.0.0.0
      --port 4200
      --proxy-config proxy.conf.docker.json
      --poll 2000
