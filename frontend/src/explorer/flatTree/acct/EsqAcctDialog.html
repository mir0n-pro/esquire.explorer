<mat-toolbar class="mat-elevation-z2 esq-dialog-toolbar"
    cdkDrag
    cdkDragRootElement=".cdk-overlay-pane"
    cdkDragHandle
    cdkDragBoundary=".cdk-overlay-container"
    [esqDialogResize]="'acct:' + userId"
>
    <div>
        @if (loading() || saving()) {
            <span class="esq-loading-div"></span>
        } @else {
            <img [src]="headerIcon" class="esq-base-icon"/>
        }
    </div>
    <div>{{headerText}}</div>
    <button matIconButton (click)="onCancel()" class="esq-icon-button" matTooltip="Close">
        <mat-icon>close</mat-icon>
    </button>
</mat-toolbar>

<mat-dialog-content>
    <div class="esq-acct-picker">
        <b>{{idLabel}}:</b>
        <esq-acct-picker
            [entityId]="entityId"
            [entityKind]="entityKind"
            [entityName]="entityName"
            [userId]="userId"
            [restApi]="restApi"
            [callApi]="callApi"
            [selectorFactory]="selectorFactory"
            [reloadTrigger]="reloadTrigger"
            (entityChange)="onEntityChange($event)"
        />
    </div>
    @for (field of fields; track field.name) {
        <esq-tab-field
            [field]="field"
            [details]="details"
            [callApi]="callApi"
            [readOnly]="false"
            [enableDetails]="false"
            [userId]="userId"
        />
    }

</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button (click)="onCancel()">Close</button>
    <button mat-raised-button type="submit" [disabled]="!canSubmit()" (click)="onSubmit()" class="esq-acct-submit-btn">Submit</button>
    <button mat-raised-button (click)="loadEntity()">Refresh</button>
</mat-dialog-actions>
