<div class="esq-acct-picker-row">
  <div class="esq-acct-picker-box">
    @if (loading()) {
      <span class="esq-loading-div" style="width:16px;height:16px;flex-shrink:0;"></span>
    } @else if (entityId) {
      <img [src]="entityIcon" class="esq-acct-icon"/>
    } @else {
      <span style="width:16px;display:inline-block;"></span>
    }
    <span class="esq-acct-picker-name" tabindex="0">{{entityName}}</span>
    <button class="esq-acct-picker-btn" (click)="onSelectAccount()" matTooltip="Select account">
      <mat-icon>keyboard_arrow_down</mat-icon>
    </button>
    <button class="esq-acct-picker-btn" (click)="onOpenDetails()" matTooltip="Details">
      <mat-icon>wysiwyg</mat-icon>
    </button>
  </div>
  <span class="esq-acct-ccy">{{entityData()?.ccy}}</span>
  <span class="esq-acct-balance">{{entityData()?.balance | number:'1.2-2'}}</span>
</div>
