      <h1>Esquire Application Frameworks 2.0</h1>
      <p><strong>Open-source backoffice framework: tree-shaped authorization. Write business logic only.</strong></p>
      <p>
        The structural backbone for any system that organizes people, organizations, and
        resources in a hierarchy: positional authority, hierarchical visibility,
        server-driven UI, full audit trail with distributed trace correlation, async entity
        synchronization. Built on Spring Boot and Angular; self-hostable on any Kubernetes
        target. No SaaS lock-in.
      </p>
      <h2>For developers building backoffice systems</h2>
      <ul>
        <li>Hierarchical entity tree (organizations / users / accounts)</li>
        <li>Tree-shaped (positional) authorization, not just role-based</li>
        <li>Server-defined UI - schema lives at the business layer, frontend adapts at runtime</li>
        <li>BRIUD audit triggers on every entity table; correlation IDs across all writes</li>
        <li>Six Spring Boot microservices, Angular SPA, ActiveMQ messaging, Keycloak IAM</li>
        <li>Demonstration domain: multi-currency accounting (deposit, withdrawal, two-leg transfer)</li>
      </ul>
