<mat-toolbar class="mat-elevation-z2 esq-dialog-toolbar"
    cdkDrag
    cdkDragRootElement=".cdk-overlay-pane"
    cdkDragHandle
    cdkDragBoundary=".cdk-overlay-container"
    [esqDialogResize]="'move:' + userId"
>
  <div>
    @if (loading()) {
      <span class="esq-loading-div"></span>
    } @else {
      <img [src]="movingNode.kind.icon" class="esq-base-icon"/>
    }
  </div>
  <div>Move: {{movingNode.name}}</div>
  <button class="esq-move-close-btn" (click)="onCancel()">&#x2715;</button>
</mat-toolbar>

<div class="esq-move-tree-panel">
  <mat-tree [dataSource]="moveDs" [levelAccessor]="levelAccessor">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding matTreeNodePaddingIndent="16"
        id="move-node-{{node.id}}"
        class="esq-move-tree-node"
        tabindex="0"
        [ngClass]="{
            'esq-move-active-node': selectedDest === node,
            'esq-move-mouse-node': hoveredNode === node && selectedDest !== node
        }"
        (click)="onNodeClick(node)"
        (keydown)="onNodeKeydown($event, node)"
        (mouseenter)="hoveredNode = node"
        (mouseleave)="hoveredNode = null"
        (focus)="hoveredNode = node"
        (blur)="hoveredNode = null">
      @if (node.expandable()) {
        <mat-icon class="esq-move-toggle-icon"
          (click)="onToggleClick(node, $event)"
          (dblclick)="onToggleDblClick(node, $event)">{{node.expanded() ? 'expand_more' : 'chevron_right'}}</mat-icon>
      } @else {
        <span style="width:24px;display:inline-block;flex-shrink:0;"></span>
      }
      <img [src]="node.kind.icon" class="esq-base-icon" (dblclick)="onNodeDblClick(node)"/>
      <span class="esq-move-overlay-text" (dblclick)="onNodeDblClick(node)">{{node.name}}</span>
    </mat-tree-node>
  </mat-tree>
</div>

<mat-dialog-actions align="center">
  <button mat-raised-button [disabled]="!canSelect()" (click)="onSelect()">Select</button>
  <button mat-raised-button (click)="onCancel()">Cancel</button>
</mat-dialog-actions>
