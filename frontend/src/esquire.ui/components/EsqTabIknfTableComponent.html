<div class="esq-tab-list-container">
    <table mat-table
       [dataSource]="tabIknfDataSource"
       class="esq-tab-list"
    >
        @for (column of listColumns; track column.columnDef; let i = $index) {
            <ng-container [matColumnDef]="column.columnDef!" >
                <th mat-header-cell *matHeaderCellDef  esqResize class="mat-elevation-z2 esq-tab-list-elevation-z1">
                    {{column.header}}
                </th>
                <td mat-cell *matCellDef="let element" class="mat-cell esq-tab-list-ellipsis-cell">
                    @if (column.columnDef === 'name') {
                        <span class="esq-tab-list-ellipsis-text">
                            @if (element.icon.length > 0) {
                                <img src="{{element.icon}}" class="esq-tab-list-base-icon"/>
                            }
                            {{element.name}}
                        </span>
                    } @else {
                        <span class="esq-tab-list-ellipsis-text">
                            {{element[column.columnDef!] }}
                        </span>
                    }
                </td>
            </ng-container>
        }
        <tr mat-header-row
            *matHeaderRowDef="listColumnsDisplayed; sticky: true"
            class="mat-header-row esq-tab-list-header-row">
        </tr>
        <tr mat-row
            *matRowDef="let node; let i = index; columns: listColumnsDisplayed;"
            class="mat-row esq-tab-list-row"
            [ngClass]="{'esq-active-list-highlight': i === listElementFocusedIndex,  'esq-mouse-list-highlight': listElementHoveredIndex === i}"
            (mouseover)="listElementHoveredIndex = i"
            (mouseout)="listElementHoveredIndex = -1"
            (click)="onListClick(i)"
            (keydown)="onListKeydown($event, i)"
            [tabindex]="i === listElementFocusedIndex ? 0 : -1"
        >
        </tr>
    </table>

</div>
