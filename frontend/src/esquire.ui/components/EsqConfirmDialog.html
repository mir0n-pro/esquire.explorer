<mat-toolbar class="mat-elevation-z2 esq-dialog-toolbar"
    cdkDrag
    cdkDragRootElement=".cdk-overlay-pane"
    cdkDragHandle
    cdkDragBoundary=".cdk-overlay-container"
    [esqDialogResize]="'confirm:' + userId"
>
  <div>
    @if (kind) {
      <img src="{{kind.icon}}" class="esq-base-icon"/>
    }
  </div>
  <div>{{header}}</div>
</mat-toolbar>

<div class="esq-confirm-content">
    <b>{{text}}</b>
</div>


<mat-dialog-actions align="center">
  @if (flag === 1) {
    <button mat-raised-button (click)="onOkYes()" (keydown)="onButtonKeydown($event, 0)">Yes</button>
    <button mat-raised-button (click)="onNoCancel()" (keydown)="onButtonKeydown($event, 1)">No</button>
  } @else if (flag === 2) {
    <button mat-raised-button (click)="onOkYes()" (keydown)="onButtonKeydown($event, 0)">OK</button>
    <button mat-raised-button (click)="onNoCancel()" (keydown)="onButtonKeydown($event, 1)">Cancel</button>
  } @else {
    <button mat-raised-button (click)="onOkYes()" (keydown)="onButtonKeydown($event, 0)">OK</button>
  }
</mat-dialog-actions>
