<div class="esq-tab-string-container"
    [ngClass] = "{'disabled' : readOnly, 'enabled' : !readOnly}">
    <textarea
        class = "esq-tab-string-textarea"
        [ngClass] = "{'disabled' : readOnly, 'enabled' : !readOnly}"
        id = "text"
        autofocus
        [readonly]="readOnly"
        [attr.maxlength]="maxLength"
        [(ngModel)]="value"
        (ngModelChange)="valueChange.emit($event)"
    ></textarea>
    
</div>
